name: Release APK

# Every push to main builds the signed APK and publishes it as a new GitHub release (tag build-<run number>).
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yarn install --frozen-lockfile

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ATLASLIGHT_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_ATLASLIGHT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ATLASLIGHT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ATLASLIGHT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # gradlew loses its executable bit when committed from Windows.
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk "atlaslight-${TAG}.apk"
          gh release create "$TAG" "atlaslight-${TAG}.apk" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
